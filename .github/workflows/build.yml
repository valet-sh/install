name: 'build'

on:
  schedule:
    - cron: "30 4 * * *"
  push:
    branches:
      - 3.x
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shellcheck:
    name: Shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          severity: error
  install:
    name: install (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - ubuntu-26.04
          - macos-26
    steps:
      - uses: actions/checkout@v7
      - name: script
        run: bash "${GITHUB_WORKSPACE}/install.sh"
        shell: bash
